# Energy Insights first-party Lovelace card
#
# The JavaScript card is bundled with the integration and auto-loaded.
# No manual Lovelace resource or Mushroom dependency is required.
#
# Monthly history is built into the main card as the last accordion.

type: custom:energy-insights-card
period_entity: select.period
statistics_entity: sensor.statistik

