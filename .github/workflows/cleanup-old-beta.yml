name: Cleanup old beta
# one-shot cleanup

on:
  push:
    branches:
      - beta
    paths:
      - ".github/workflows/cleanup-old-beta.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded beta.2 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.1.0-beta.2 --repo "${{ github.repository }}" --cleanup-tag --yes
