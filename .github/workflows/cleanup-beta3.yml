name: Cleanup beta3

on:
  push:
    branches:
      - beta
    paths:
      - ".github/workflows/cleanup-beta3.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded beta.3 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.1.0-beta.3 --repo "${{ github.repository }}" --cleanup-tag --yes
