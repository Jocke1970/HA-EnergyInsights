name: Cleanup superseded betas

on:
  push:
    branches:
      - beta
    paths:
      - ".github/workflows/cleanup-superseded-betas.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded beta releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for TAG in v0.1.0-beta.4 v0.1.0-beta.1; do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes
            fi
          done
