name: Validate

on:
  push:
    branches:
      - dev
      - beta
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q custom_components/energy_insights

      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/energy_insights/manifest.json >/dev/null
          python -m json.tool custom_components/energy_insights/translations/en.json >/dev/null
          python -m json.tool custom_components/energy_insights/translations/sv.json >/dev/null
