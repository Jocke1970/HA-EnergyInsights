name: Validate

on:
  push:
    branches:
      - dev
      - beta
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q custom_components/energy_insights

      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/energy_insights/manifest.json >/dev/null
          python -m json.tool custom_components/energy_insights/translations/en.json >/dev/null
          python -m json.tool custom_components/energy_insights/translations/sv.json >/dev/null

      - name: Validate JavaScript
        run: |
          node --check custom_components/energy_insights/frontend/energy-insights-loader.js
          node --check custom_components/energy_insights/frontend/energy-insights-card.js

      - name: Validate version sync
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/energy_insights/manifest.json").read_text()
          )["version"]
          const = re.search(
              r'^VERSION = "([^"]+)"
              Path("custom_components/energy_insights/const.py").read_text(),
              re.MULTILINE,
          ).group(1)
          loader = re.search(
              r'ENERGY_INSIGHTS_LOADER_VERSION = "([^"]+)"',
              Path("custom_components/energy_insights/frontend/energy-insights-loader.js").read_text(),
          ).group(1)
          card = re.search(
              r'ENERGY_INSIGHTS_CARD_VERSION = "([^"]+)"',
              Path("custom_components/energy_insights/frontend/energy-insights-card.js").read_text(),
          ).group(1)

          versions = {"manifest": manifest, "const": const, "loader": loader, "card": card}
          print(versions)
          if len(set(versions.values())) != 1:
              raise SystemExit("Energy Insights versions are out of sync")
          PY

              Path("custom_components/energy_insights/const.py").read_text(),
              re.MULTILINE,
          ).group(1)
          loader = re.search(
              r'ENERGY_INSIGHTS_LOADER_VERSION = "([^"]+)"',
              Path("custom_components/energy_insights/frontend/energy-insights-loader.js").read_text(),
          ).group(1)
          card = re.search(
              r'ENERGY_INSIGHTS_CARD_VERSION = "([^"]+)"',
              Path("custom_components/energy_insights/frontend/energy-insights-card.js").read_text(),
          ).group(1)

          versions = {"manifest": manifest, "const": const, "loader": loader, "card": card}
          print(versions)
          if len(set(versions.values())) != 1:
              raise SystemExit("Energy Insights versions are out of sync")
          PY
