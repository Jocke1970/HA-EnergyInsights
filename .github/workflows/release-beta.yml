name: Release beta

on:
  push:
    branches:
      - beta
    paths:
      - "custom_components/energy_insights/manifest.json"
      - ".github/workflows/release-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/energy_insights/manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify beta version
        shell: bash
        run: |
          case "${{ steps.version.outputs.version }}" in
            *-beta.*) ;;
            *)
              echo "Manifest version is not a beta version."
              exit 1
              ;;
          esac

      - name: Publish current beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES="Energy Insights 2026-10 beta release ($TAG). Adds Recorder-backed Nordpool net price records for current month and year-to-date/history-start. Install through HACS with beta versions enabled."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "2026-10" \
            --notes "$NOTES"
