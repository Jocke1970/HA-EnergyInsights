name: Release beta

on:
  push:
    branches:
      - beta
    paths:
      - "custom_components/energy_insights/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/energy_insights/manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify beta version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^20[0-9]{2}\.[0-9]{1,2}\.[0-9]+b[0-9]+
      - name: Publish current beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Energy Insights beta $VERSION. Install through HACS with beta versions enabled."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$VERSION" \
            --notes "$NOTES"
; then
            echo "Manifest version must use calendar beta format, e.g. 2026.10.0b1."
            exit 1
          fi

      - name: Publish current beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          NOTES="Energy Insights 2026-10 beta release ($TAG). Adds Recorder-backed Nordpool net price records for current month and year-to-date/history-start. Install through HACS with beta versions enabled."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "2026-10" \
            --notes "$NOTES"
